<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span id="header-title">DZIENNIK</span>
    <div id="settings-wrap">
      <button id="btn-settings" onclick="toggleSettings()" title="Ustawienia">⚙</button>
      <div id="settings-menu">
        <span class="settings-label">Motyw</span>
        <div id="theme-grid"></div>
        <hr class="settings-divider">
        <button class="settings-btn" onclick="exportData(); toggleSettings()">↓ eksport</button>
        <label class="settings-btn">↑ import
          <input type="file" accept=".json" onchange="importData(event); toggleSettings()" style="display:none;">
        </label>
      </div>
    </div>
  </header>

  <div class="layout">

    <div class="col-cal">
      <div class="col-header">Kalendarz</div>
      <div class="col-inner">
        <div id="cal-nav">
          <button onclick="changeMonth(-1)" title="Poprzedni miesiąc">‹</button>
          <span id="cal-nav-label"></span>
          <button onclick="changeMonth(1)" title="Następny miesiąc">›</button>
        </div>
        <div id="cal-grid"></div>
        <div id="clock" onclick="insertTime()" title="Kliknij żeby wstawić godzinę"></div>
      </div>
    </div>

    <div class="col-journal">
      <div class="col-header">Dziennik</div>
      <div class="col-inner" id="stream"></div>
    </div>

  </div>


  <!-- Popup energii -->
  <div id="energy-overlay">
    <div id="energy-popup">
      <div id="energy-value-display">5</div>
      <input id="energy-slider" type="range" min="0" max="10" value="5"
        oninput="updateEnergyDisplay(this.value)">
      <div id="energy-labels"><span>0</span><span>5</span><span>10</span></div>
      <button id="energy-confirm" onclick="confirmEnergy()">Wstaw</button>
      <button id="energy-cancel" onclick="closeEnergyPopup()">Anuluj</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
